[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-verification-playbook"
version = "0.2.0"
description = "Zero-dependency repository AI-policy scanner and verification toolkit for non-coders directing AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Andre Romero" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/KilianTheMagnificent/agent-verification-playbook"
Repository = "https://github.com/KilianTheMagnificent/agent-verification-playbook"
Issues = "https://github.com/KilianTheMagnificent/agent-verification-playbook/issues"

[project.scripts]
check-repo-policy = "check_repo_policy:main"

[tool.setuptools]
py-modules = ["check_repo_policy"]
package-dir = { "" = "scripts" }
